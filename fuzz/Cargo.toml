[package]
name = "kira-vrs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
kira-vrs = { path = "../crates/kira-vrs" }
serde_json = "1"

[[bin]]
name = "json_variation"
path = "fuzz_targets/json_variation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_round_trip"
path = "fuzz_targets/json_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize_allele"
path = "fuzz_targets/normalize_allele.rs"
test = false
doc = false
bench = false

[[bin]]
name = "digest_serialization"
path = "fuzz_targets/digest_serialization.rs"
test = false
doc = false
bench = false
